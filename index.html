<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#7a1230">
<title>حل مساله چتر</title>
<style>
:root{color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;forced-color-adjust:none}
html,body{margin:0;min-height:100%}
body{font-family:Tahoma,"Segoe UI",Vazirmatn,sans-serif;background:#6d0f2e;background-image:radial-gradient(circle at 20% 10%,#a3254a 0,#6d0f2e 45%,#3f0719 100%);background-attachment:fixed;color:#2b2b2b;padding:14px 10px 30px;overflow-x:hidden}
#stickers{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.st{position:absolute;bottom:-90px;animation:rise linear infinite}
.st svg{width:100%;height:100%;display:block;animation:sway ease-in-out infinite alternate}
@keyframes rise{to{transform:translateY(-120vh)}}
@keyframes sway{from{transform:rotate(-18deg)}to{transform:rotate(18deg)}}
.card{position:relative;z-index:1;max-width:620px;margin:0 auto;background:#ffffff;border-radius:22px;padding:18px 16px 14px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{margin:4px 0 8px;text-align:center;color:#7a1230;font-size:1.7rem}
.page{display:none}.page.on{display:block}
.hero{width:190px;height:190px;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;pointer-events:none}
.hero img{width:180px;height:auto;mix-blend-mode:multiply;animation:spin 26s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.menu{display:flex;flex-direction:column;gap:12px;margin:8px 0}
.main{border:3px solid #000000;border-radius:16px;padding:15px;font:inherit;font-size:1.05rem;font-weight:bold;color:#ffffff;cursor:pointer;transition:transform .15s,box-shadow .15s;text-shadow:0 1px 0 rgba(0,0,0,.5);position:relative;transform:translateY(-6px)}
.main:nth-child(1){background:linear-gradient(180deg,#4aa8ff,#0b5ed7);box-shadow:0 6px 0 #000000,0 10px 12px rgba(0,0,0,.35)}
.main:nth-child(2){background:linear-gradient(180deg,#ffe866,#f5c400);color:#000000;text-shadow:none;box-shadow:0 6px 0 #000000,0 10px 12px rgba(0,0,0,.35)}
.main:nth-child(3){background:linear-gradient(180deg,#ff6b6b,#d00000);box-shadow:0 6px 0 #000000,0 10px 12px rgba(0,0,0,.35)}
.main:active{transform:translateY(0);box-shadow:0 0 0 #000000,0 2px 4px rgba(0,0,0,.35)}
.tools{display:flex;gap:10px;justify-content:center;margin-top:14px}
.soft{border:1px solid #d6d6d6;background:#efefef;color:#8a8a8a;border-radius:10px;padding:7px 14px;font:inherit;font-size:.85rem;cursor:pointer}
.back{position:sticky;top:6px;z-index:5;display:flex;align-items:center;gap:8px;margin:0 0 10px;border:0;border-radius:30px;padding:9px 18px;font:inherit;font-weight:bold;color:#fff;cursor:pointer;background:linear-gradient(90deg,#d6365f,#7a1230,#d6365f);background-size:200% 100%;animation:shine 3s linear infinite,pulse 1.8s ease-in-out infinite;box-shadow:0 4px 14px rgba(122,18,48,.5)}
.back .ar{display:inline-block;animation:nudge 1s ease-in-out infinite}
@keyframes shine{to{background-position:-200% 0}}
@keyframes pulse{50%{transform:scale(1.05)}}
@keyframes nudge{50%{transform:translateX(6px)}}
h2{color:#7a1230;font-size:1.25rem;text-align:center;margin:4px 0 10px}
.step{margin:10px 0;line-height:2;font-size:1rem;animation:wipe 1.2s ease-out both}
@keyframes wipe{from{clip-path:inset(0 0 0 100%);opacity:.2}to{clip-path:inset(0 0 0 0);opacity:1}}
.step h3{margin:0;color:#7a1230}
.step p{margin:0}
.box{background:#fdeef2;border-right:5px solid #a3254a;border-radius:10px;padding:8px 12px}
.link{background:#fff6dc;border-right:5px solid #e0a800;border-radius:10px;padding:8px 12px}
.ans{background:#e8f6ea;border-right:5px solid #2e9a4a;border-radius:10px;padding:8px 12px;font-weight:bold}
math{font-size:1.25em;font-family:"STIX Two Math","Cambria Math","Latin Modern Math",serif}
math[display="block"]{margin:6px 0;overflow-x:auto;overflow-y:hidden;padding:2px 0}
svg.fig{width:100%;height:auto;background:#fffdfd;border:1px solid #eadada;border-radius:12px;direction:ltr}
.fig text{font-family:Tahoma,sans-serif;font-size:11px}
.d{fill:none;stroke-width:3;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:dr 1.8s ease forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.be{opacity:0;transition:opacity .8s}.be.show{opacity:1}
.be circle.p{animation:beat 1s infinite}
@keyframes beat{50%{r:9}}
footer{text-align:center;direction:ltr;margin-top:16px;color:#7a1230;font-weight:bold;font-size:.95rem}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:8px 16px;border-radius:20px;font-size:.85rem;z-index:20;display:none}
</style>
</head>

<script>
const $=s=>document.querySelector(s), sleep=ms=>new Promise(r=>setTimeout(r,ms));
const fa=s=>s.replace(/(\d)\.(\d)/g,'$1٫$2').replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const mi=t=>`<mi>${t}</mi>`,mo=t=>`<mo>${t}</mo>`,mn=t=>`<mn>${t}</mn>`,sup=(a,b)=>`<msup>${a}${b}</msup>`;
const M=(s,b)=>`<math dir="ltr"${b?' display="block"':''}><mrow>${s}</mrow></math>`;
const X=mi('x'),f=(n,a)=>mi(n)+mo('(')+a+mo(')'),P=f('P',X),R=f('R',X),C=f('C',X),px=f('p',X);
const poly=px+mo('=')+mo('−')+sup(X,mn(2))+mo('+')+mn(2000)+X+mo('−')+mn(24000);
const poly0=mo('−')+sup(X,mn(2))+mo('+')+mn(2000)+X+mo('−')+mn(24000)+mo('=')+mn(0);
const x2=sup(X,mn(2))+mo('−')+mn(2000)+X+mo('+')+mn(24000)+mo('=')+mn(0);
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',1800)};

// stickers
const sc=['#ffd1dc','#ffe08a','#bfe3ff','#c9f2c7','#ffb3c1','#e3c8ff'];
for(let i=0;i<16;i++){const e=document.createElement('div');e.className='st';const z=34+Math.random()*40;
e.style.cssText=`left:${Math.random()*95}%;width:${z}px;height:${z}px;color:${sc[i%6]};opacity:.55;animation-duration:${14+Math.random()*16}s;animation-delay:-${Math.random()*20}s`;
e.innerHTML=`<svg style="animation-duration:${2+Math.random()*3}s"><use href="#um"/></svg>`;$('#stickers').appendChild(e)}

// figures
const fig1=()=>`<svg class="fig" viewBox="0 0 320 215">
<path d="M30 190H308M30 190V12" stroke="#555" stroke-width="2" fill="none"/>
<text x="308" y="205" text-anchor="end">x (تعداد کالا)</text><text x="36" y="14">پول</text>

const fig2=()=>{const sx=x=>30+x*.135,sy=p=>130-p*1e-4;let d='';
for(let x=0;x<=2000;x+=50){const p=-x*x+2000*x-24000;d+=(x?'L':'M')+sx(x).toFixed(1)+' '+sy(p).toFixed(1)}
return `<svg class="fig" viewBox="0 0 320 170"><path d="M20 130H312M30 150V12" stroke="#555" stroke-width="2" fill="none"/>
<text x="312" y="146" text-anchor="end">x</text><text x="36" y="14">p(x)</text>
<path class="d" pathLength="1" d="${d}" stroke="#a3254a"/>
<circle cx="${sx(0)}" cy="${sy(-24000)}" r="4" fill="#c62828"/><text x="38" y="164" fill="#c62828">p(۰) = −۲۴۰۰۰</text>
<g class="be"><circle class="p" cx="32" cy="130" r="5" fill="#7a1230"/><circle class="p" cx="298" cy="130" r="5" fill="#7a1230"/>
<text x="22" y="122" fill="#7a1230">≈۱۲</text><text x="282" y="122" fill="#7a1230">≈۱۹۸۸</text>
<text x="165" y="100" text-anchor="middle" fill="#1b7f3b">p(x) &gt; ۰ : سود</text></g></svg>`};
const reveal=b=>()=>b.querySelector('.be').classList.add('show');

const S={
p1:[
 {h:`<h3>مقدمه</h3><p>در هر مسئلهٔ اقتصادی، اگر ${M(X)} مقدار یا تعداد محصول باشد، سه رابطهٔ مهم تعریف می‌شود:</p>`},
 {c:'box',h:`<p><b>رابطهٔ هزینه (cost)</b> یا ${M(C)} : هزینهٔ تولید ${M(X)} واحد کالا</p>`},
 {c:'box',h:`<p><b>رابطهٔ سود (profit)</b> یا ${M(P)} : سود حاصل از فروش ${M(X)} واحد کالا</p>`},
 {c:'box',h:`<p><b>رابطهٔ درآمد (Revenue)</b> یا ${M(R)} : درآمد حاصل از فروش ${M(X)} واحد کالا</p>`},
 {h:`<p>ارتباط میان این سه رابطه:</p>${M(P+mo('=')+R+mo('−')+C,1)}<p>یعنی: سود = درآمد (فروش) − هزینه</p>`},
 {raw:1,w:4200,h:`<p>بیایید این را روی نمودار ببینیم: خط قرمز هزینه و خط سبز درآمد است.</p>${fig1()}`},
 {c:'link',w:2200,after:b=>b.querySelector('.be')&&0,h:`<p><b>نقطهٔ سر به سر (break-even):</b> میزانی از تولید یک بنگاه اقتصادی که در آن، هزینه‌ها با درآمدها برابر می‌شود و بنگاه نه سود می‌کند و نه ضرر.</p>${M(R+mo('=')+C+mo('⟹')+P+mo('=')+mn(0),1)}<p>در نمودار، همان نقطهٔ برخورد دو خط است؛ سمت چپ آن زیان (R &lt; C) و سمت راست آن سود (R &gt; C) است.</p>`,reveal:1}
],
p2:[
 {h:`<h3>متن مسئله</h3><p>در یک کارگاه تولید چتر، سود حاصل از فروش ${M(X)} چتر به‌طور تقریبی از رابطهٔ زیر به‌دست می‌آید:</p>${M(poly,1)}`},
 {c:'box',h:`<p><b>الف)</b> اگر این کارگاه چتری نفروشد، چقدر از دست می‌دهد؟</p>`},
 {c:'box',h:`<p><b>ب)</b> نقطهٔ سر به سر (break-even) میزانی از تولید یک بنگاه اقتصادی را نشان می‌دهد که در آن میزان هزینه‌ها با میزان درآمدها برابر می‌شود و بنگاه در این سطح از تولید نه سود می‌کند و نه ضرر.</p><p>در مثال بالا به ازای چه تعداد فروش چتر، کارگاه به نقطهٔ سر به سر خود می‌رسد؟</p>`},
 {c:'link',h:`<p><b>🔎 چی داریم؟</b></p><p>• تابع سود: ${M(poly)}</p><p>• ${M(X)} همان تعداد چترهای فروخته‌شده است.</p>`},
 {c:'ans',h:`<p><b>🎯 دنبال چی هستیم؟</b></p><p>الف) سود وقتی هیچ چتری فروخته نشود، یعنی مقدار ${M(f('p',mn(0)))}</p><p>ب) تعداد ${M(X)}ای که به ازای آن سود صفر شود، یعنی ${M(px+mo('=')+mn(0))}</p>`}
],
p3:[
 {h:`<h3>داده</h3>${M(poly,1)}`},
 {h:`<p><b>الف)</b> «چتری نفروشد» یعنی ${M(X+mo('=')+mn(0))}:</p>${M(f('p',mn(0))+mo('=')+mo('−')+sup(mn(0),mn(2))+mo('+')+mn(2000)+mo('×')+mn(0)+mo('−')+mn(24000)+mo('=')+mo('−')+mn(24000),1)}`},
 {h:`<p>سود منفی یعنی زیان؛ پس کارگاه <b>۲۴۰۰۰ واحد پول</b> از دست می‌دهد.</p>`},
 {c:'link',h:`<p>🔗 <b>ربط به تعریف‌ها:</b> وقتی فروش صفر است، ${M(R+mo('=')+mn(0))} (درآمدی نداریم)، پس از ${M(P+mo('=')+R+mo('−')+C)} نتیجه می‌شود ${M(f('P',mn(0))+mo('=')+mo('−')+f('C',mn(0)))}. یعنی ۲۴۰۰۰ همان هزینه‌ای است که بدون هیچ فروشی باید بپردازیم و روی نمودار، کارگاه در ناحیهٔ زیان (درآمد زیر هزینه) شروع می‌کند.</p>`},
 {h:`<p><b>ب)</b> نقطهٔ سر به سر یعنی سود صفر:</p>${M(poly0,1)}`},
 {h:`<p>دو طرف را در ${M(mo('−')+mn(1))} ضرب می‌کنیم:</p>${M(x2,1)}`},
 {h:`<p>ضریب ${M(X)} زوج است، پس از ${M(mi('Δ′')+mo('=')+sup(mo('(')+mi('b')+mo('/')+mn(2)+mo(')'),mn(2))+mo('−')+mi('a')+mi('c'))} استفاده می‌کنیم:</p>${M(mi('Δ′')+mo('=')+sup(mo('(')+mo('−')+mn(1000)+mo(')'),mn(2))+mo('−')+mn(1)+mo('×')+mn(24000)+mo('=')+mn(976000),1)}<p>مثبت است؛ پس دو ریشه داریم.</p>`},
 {h:`${M(X+mo('=')+mn(1000)+mo('±')+'<msqrt>'+mn(976000)+'</msqrt>'+mo('≈')+mn(1000)+mo('±')+mn('987.93'),1)}${M(mi('x₁')+mo('≈')+mn('12.07')+mo(',')+mi('x₂')+mo('≈')+mn('1987.93'),1)}`},
 {raw:1,w:4200,h:`<p>نمودار سود (سهمی رو به پایین) محور x را تقریباً در همین دو نقطه قطع می‌کند:</p>${fig2()}`,reveal:1},
 {c:'link',h:`<p>🔗 <b>ربط به تعریف‌ها:</b> ${M(P+mo('=')+mn(0))} یعنی ${M(R+mo('=')+C)}؛ همان نقطهٔ برخورد درآمد و هزینه. اینجا دو نقطهٔ سر به سر داریم: حدود ۱۲ چتر (شروع سود) و حدود ۱۹۸۸ چتر (پایان سود). بین این دو ${M(R+mo('&gt;')+C)} و سود مثبت است؛ بیرون از آن‌ها زیان داریم.</p>`},
 {c:'ans',h:`<p>✅ الف) ۲۴۰۰۰ واحد پول زیان</p><p>✅ ب) کارگاه تقریباً به ازای فروش ۱۲ چتر و ۱۹۸۸ چتر به نقطهٔ سر به سر می‌رسد.</p>`}
]};

// engine
let tok=0;
async function play(id,steps){const my=++tok,box=$('#'+id+' .out');box.innerHTML='';
 for(const s of steps){if(my!==tok)return;const d=document.createElement('div');d.className='step '+(s.c||'');
  d.innerHTML=s.raw?fa0(s.h):fa(s.h);box.appendChild(d);
  if(s.reveal){const q=box.querySelectorAll('.be');const l=q[q.length-1];if(l){await sleep(1800);if(my!==tok)return;l.classList.add('show')}}
  d.scrollIntoView({behavior:'smooth',block:'end'});await sleep(s.w||2200)}}
// raw steps: convert digits only outside svg
const fa0=h=>h.split(/(<svg[\s\S]*?<\/svg>)/).map(p=>p.startsWith('<svg')?p:fa(p)).join('');
function go(id){tok++;document.querySelectorAll('.page').forEach(p=>p.classList.toggle('on',p.id===id));window.scrollTo(0,0);if(id!=='home')play(id,S[id])}
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));

// music
const au=new Audio('https://v.delgarm.com/mp3/804/2021/03/08/00bcb27a0f57507911ef0163fcb5bb04.mp3');au.loop=true;au.preload='none';
const mus=$('#mus');
mus.onclick=()=>{if(au.paused){au.play().then(()=>mus.textContent='⏹ توقف آهنگ').catch(()=>toast('پخش آهنگ ممکن نشد'))}else{au.pause();mus.textContent='▶ پخش آهنگ'}};
$('#clr').onclick=()=>{tok++;document.querySelectorAll('.out').forEach(o=>o.innerHTML='');au.pause();au.currentTime=0;mus.textContent='▶ پخش آهنگ';toast('پاک شد')};
</script>
